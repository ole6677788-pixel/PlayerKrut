<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlayerKrut · 1.1.0</title>
<style>
:root{--pink:#ff3eae;--violet:#8d5cff;--muted:#aaa6bd;--panel:#100e1af2}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:Inter,"Segoe UI",system-ui,sans-serif;user-select:none}body{padding:8px}.shell{height:100%;width:100%;position:relative;isolation:isolate;overflow:hidden;border-radius:27px;border:1px solid #ffffff24;background:linear-gradient(145deg,#21152cf7 0%,#100f1cf7 48%,#1d1026f7 100%);box-shadow:0 18px 50px #0009,inset 0 1px #ffffff12;display:flex;flex-direction:column;padding:15px 17px 12px;backdrop-filter:blur(24px)}#aurora{position:absolute;inset:0;width:100%;height:100%;z-index:-2;opacity:.92;pointer-events:none}.glow{position:absolute;width:230px;height:230px;border-radius:50%;filter:blur(65px);opacity:.22;z-index:-1;pointer-events:none;background:var(--pink);left:-100px;top:80px}.glow.two{left:auto;right:-110px;top:-110px;background:var(--violet);opacity:.25}.top{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;-webkit-app-region:drag}.brand{font-size:12px;font-weight:900;letter-spacing:2.6px;background:linear-gradient(90deg,#fff,#ff83d0 55%,#b59aff);-webkit-background-clip:text;background-clip:text;color:transparent}.brand small{display:block;margin-top:3px;font-size:8px;font-weight:650;letter-spacing:1.8px;color:#a59bb9}.actions{display:flex;gap:5px;-webkit-app-region:no-drag}.winbtn{width:25px;height:25px;border:1px solid #ffffff13;border-radius:9px;background:#ffffff09;color:#ded8ec;cursor:pointer;font-size:15px;transition:.18s}.winbtn:hover{background:#ffffff20;transform:translateY(-1px)}.version{font-size:9px;color:#928ba8;letter-spacing:.6px;margin-right:4px;align-self:center}.stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5px 0 2px}.orb-wrap{position:relative;width:min(42%,158px);aspect-ratio:1;margin:2px auto 12px;flex-shrink:0;display:grid;place-items:center}.orb-wrap:before,.orb-wrap:after{content:"";position:absolute;inset:-9%;border:1px solid #ff77d755;border-radius:43% 57% 61% 39%/45% 40% 60% 55%;animation:orbit 8s linear infinite}.orb-wrap:after{inset:-17%;border-color:#9e7bff50;border-radius:60% 40% 45% 55%/55% 60% 40% 45%;animation:orbit 11s linear infinite reverse}.orb{position:absolute;inset:7%;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 35% 25%,#ffb6e7 0,#ff55b7 15%,#a447ed 43%,#4c2a95 70%,#17112d 100%);box-shadow:0 0 28px #ec4db65c,0 0 75px #9a4dff36,inset -12px -16px 32px #0c071c88,inset 7px 8px 23px #ffffff38;animation:float 3.4s ease-in-out infinite;transform-origin:center} .orb:before{content:"";position:absolute;inset:-20%;border-radius:42% 58% 55% 45%;background:conic-gradient(from 10deg,transparent,#ffb2e7aa,transparent,#8f7affaa,transparent);filter:blur(5px);animation:orbit 5s linear infinite}.orb:after{content:"";position:absolute;inset:15%;border-radius:50%;border:1px solid #ffffff42;box-shadow:inset 0 0 20px #fff2}.orb-wrap.playing .orb{animation:float .8s ease-in-out infinite, pulse 1.25s ease-in-out infinite}.orb-wrap.playing:before{animation-duration:2.6s}.orb-wrap.playing:after{animation-duration:3.2s}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes float{0%,100%{translate:0 0;scale:1}50%{translate:0 -4px;scale:1.035}}@keyframes pulse{0%,100%{box-shadow:0 0 25px #ec4db65c,0 0 50px #9a4dff36,inset -12px -16px 32px #0c071c88,inset 7px 8px 23px #ffffff38}50%{box-shadow:0 0 45px #ff4ab4a0,0 0 100px #9a4dff72,inset -12px -16px 32px #0c071c88,inset 7px 8px 23px #ffffff38}}.playing-tag{display:flex;align-items:center;gap:6px;font-size:9px;font-weight:750;letter-spacing:2px;color:#f6a7d8;margin-bottom:8px}.dot{width:5px;height:5px;border-radius:50%;background:var(--pink);box-shadow:0 0 10px var(--pink)}.title{width:100%;font-size:clamp(15px,4vw,22px);font-weight:820;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}.artist{width:100%;font-size:clamp(11px,2.4vw,14px);color:#c2bdd1;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.album{width:100%;font-size:10px;color:#827b99;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls{display:flex;align-items:center;justify-content:center;gap:11px;flex-shrink:0;margin:9px 0 10px}.ctrl{width:37px;height:37px;display:grid;place-items:center;border:1px solid #ffffff19;border-radius:13px;background:#ffffff0b;color:#f5eaf8;cursor:pointer;font-size:16px;transition:transform .16s,background .16s}.ctrl:hover{transform:translateY(-2px);background:#ffffff20}.ctrl.main{width:49px;height:43px;border:1px solid #ffb4e5aa;border-radius:15px;background:linear-gradient(135deg,#ff4eb4,#a45cff);box-shadow:0 5px 25px #d840a54d;font-size:18px}.ctrl.open{width:auto;padding:0 12px;font-size:10px;font-weight:700;letter-spacing:.2px;border-radius:12px;color:#f5c8e8}.footer{display:flex;align-items:center;gap:8px;flex-shrink:0;padding-top:8px;border-top:1px solid #ffffff12}.bars{height:15px;width:33px;display:flex;align-items:center;justify-content:center;gap:2px}.bars i{width:3px;height:4px;border-radius:4px;background:linear-gradient(#ff7fc9,#a17aff);box-shadow:0 0 5px #f15bbd;animation:bar .65s ease-in-out infinite alternate}.bars i:nth-child(2){animation-delay:-.35s}.bars i:nth-child(3){animation-delay:-.1s}.bars i:nth-child(4){animation-delay:-.5s}.bars i:nth-child(5){animation-delay:-.25s}@keyframes bar{to{height:14px}}.shell.idle .bars i{animation-play-state:paused;height:3px;opacity:.45}.status{flex:1;font-size:9px;letter-spacing:1px;color:#9d96b1}.source{max-width:40%;font-size:9px;color:#c1a5d5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}.seek{height:2px;position:absolute;left:0;bottom:0;background:linear-gradient(90deg,#ff46b5,#a46bff,#69d7ff);box-shadow:0 0 12px #f04cb7;transition:width .5s}.shell.idle .orb-wrap{filter:saturate(.65);opacity:.8}@media(max-height:340px){.orb-wrap{width:min(30%,100px);margin-bottom:4px}.stage{padding:0}.controls{margin:3px 0 5px}.shell{padding:9px 13px}.footer{padding-top:4px}}
</style></head><body><div class="shell idle" id="shell"><canvas id="aurora"></canvas><div class="glow"></div><div class="glow two"></div>
<div class="top"><div class="brand">PLAYERKRUT<small>YOUR MUSIC • YOUR VIBE</small></div><div class="actions"><span class="version">v1.1.0</span><button class="winbtn" id="smaller" title="Уменьшить">−</button><button class="winbtn" id="larger" title="Увеличить">＋</button><button class="winbtn" id="pin" title="Поверх окон">⌖</button><button class="winbtn" id="min" title="Свернуть">—</button><button class="winbtn" id="close" title="Закрыть">×</button></div></div>
<div class="stage"><div class="orb-wrap" id="orbWrap"><div class="orb"></div></div><div class="playing-tag"><span class="dot"></span><span id="eyebrow">NOW PLAYING</span></div><div class="title" id="title">Ищем музыку…</div><div class="artist" id="artist">Запусти трек в поддерживаемом приложении</div><div class="album" id="album"></div></div>
<div class="controls"><button class="ctrl" id="previous" title="Предыдущий трек">⏮</button><button class="ctrl main" id="playpause" title="Пауза или воспроизведение">▶</button><button class="ctrl" id="next" title="Следующий трек">⏭</button><button class="ctrl open" id="openapp" title="Вернуться в приложение с музыкой">↗ Открыть</button></div>
<div class="footer"><div class="bars"><i></i><i></i><i></i><i></i><i></i></div><div class="status" id="status">READY TO VIBE</div><div class="source" id="source">DESKTOP PLAYER</div></div><div class="seek" id="progress" style="width:0"></div></div>
<script>
const $=id=>document.getElementById(id);let busy=false,anim=null,phase=0;
async function update(){if(busy)return;busy=true;try{const d=await window.playerAPI.getNowPlaying();const has=!!(d&&d.title);$('shell').classList.toggle('idle',!d?.playing);$('orbWrap').classList.toggle('playing',!!d?.playing);$('title').textContent=has?d.title:'Ничего не играет';$('artist').textContent=has?(d.artist||'Неизвестный исполнитель'):'Запусти музыку — я покажу трек';$('album').textContent=has?(d.album||'') : ''; $('eyebrow').textContent=d?.playing?'NOW PLAYING':has?'PAUSED':'READY WHEN YOU ARE';$('status').textContent=d?.playing?'PLAYING • LIVE':has?'PAUSED • READY':'WAITING FOR MEDIA';$('source').textContent=has?(d.app||'DESKTOP').split('!')[0].split(/[.\\]/).pop().slice(0,24).toUpperCase():'DESKTOP PLAYER';$('progress').style.width=d?.playing?'72%':'0%';$('playpause').textContent=d?.playing?'Ⅱ':'▶';}catch(e){$('title').textContent='Музыка пока не найдена';$('artist').textContent='Проверь системный медиаконтрол Windows';}finally{busy=false}}
async function control(action){await window.playerAPI.control(action);setTimeout(update,450)}
$('previous').onclick=()=>control('previous');$('playpause').onclick=()=>control('playpause');$('next').onclick=()=>control('next');$('openapp').onclick=async()=>{const r=await window.playerAPI.openSourceApp();$('openapp').textContent=r?.ok?'✓ Открыто':'Не найдено';setTimeout(()=>$('openapp').textContent='↗ Открыть',1800)};$('close').onclick=()=>window.playerAPI.close();$('min').onclick=()=>window.playerAPI.minimize();$('pin').onclick=()=>window.playerAPI.togglePin();$('smaller').onclick=()=>window.playerAPI.scale(-60);$('larger').onclick=()=>window.playerAPI.scale(60);
const canvas=$('aurora'),ctx=canvas.getContext('2d');function draw(){const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(rect.width*dpr)||canvas.height!==Math.round(rect.height*dpr)){canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,rect.width,rect.height);phase+=0.018;const w=rect.width,h=rect.height;for(let k=0;k<3;k++){const cx=w*(.25+k*.25)+Math.sin(phase*(.8+k*.2)+k)*w*.12,cy=h*(.2+k*.26)+Math.cos(phase+k)*h*.1,r=Math.min(w,h)*(.22+k*.07);const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,k===1?'rgba(153,95,255,.12)':'rgba(255,70,180,.11)');g.addColorStop(1,'rgba(80,50,150,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill()}if(!$('shell').classList.contains('idle')){for(let j=0;j<24;j++){const a=phase*.4+j*Math.PI*2/24,rad=Math.min(w,h)*(.24+Math.sin(phase*2+j*.7)*.025),x=w/2+Math.cos(a)*rad,y=h*.48+Math.sin(a)*rad*.7;ctx.fillStyle=j%2?'rgba(255,112,205,.5)':'rgba(167,125,255,.5)';ctx.beginPath();ctx.arc(x,y,1.1+Math.sin(phase*3+j)*.8,0,Math.PI*2);ctx.fill()}}anim=requestAnimationFrame(draw)}draw();update();setInterval(update,1800);
</script></body></html>
