<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlayerKrut · 1.15.0</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:"Segoe UI",Inter,system-ui,sans-serif;user-select:none}
button{font:inherit;border:0;background:transparent;color:inherit;cursor:pointer}
.shell{position:relative;isolation:isolate;display:flex;flex-direction:column;width:100%;height:100%;overflow:hidden;border-radius:16px;background:#000;box-shadow:0 20px 50px #000c}
#aurora{position:absolute;inset:0;z-index:0;width:100%;height:100%;pointer-events:none}
.ui-layer{position:relative;z-index:1;display:flex;flex:1;flex-direction:column;min-height:0;padding:8px 12px 12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:22px;-webkit-app-region:drag}
.brand{font-size:9px;font-weight:700;letter-spacing:1.2px;color:#ffffff66}
.actions{display:flex;align-items:center;gap:3px;-webkit-app-region:no-drag}
.version{padding:3px 7px;border-radius:6px;background:#ffffff12;color:#e8a0a8;font-size:9px;cursor:pointer}
.version:hover{background:#ffffff22}
.winbtn{display:grid;place-items:center;width:20px;height:20px;border-radius:5px;background:#ffffff10;color:#ffffffb0;font-size:11px}
.winbtn:hover{background:#ffffff28;color:#fff}
.stage{display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.cover-scene{position:relative;width:min(46vw,32vh,160px);aspect-ratio:1;flex:0 0 auto;margin-bottom:14px;z-index:2}
.orb{position:absolute;inset:0;overflow:hidden;border-radius:14px;background:#1a1216;box-shadow:0 10px 36px #000a}
.orb img{display:block;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.cover-ph{position:absolute;inset:0;display:grid;place-items:center;color:#ffffff28;font-size:clamp(28px,9vh,48px);pointer-events:none}
.has-cover .cover-ph{display:none}
.playing .orb{animation:coverbeat 3s ease-in-out infinite}
.track-info{display:flex;flex-direction:column;align-items:center;width:min(88%,300px);gap:5px;z-index:2}
.title{display:block;width:100%;padding:8px 16px;overflow:hidden;border-radius:999px;background:linear-gradient(90deg,#e07088aa 0%,#e07088aa var(--track-progress,0%),#ffffff18 var(--track-progress,0%),#ffffff18 100%);border:1px solid #ffffff14;color:#fff;font-size:clamp(12px,3.4vw,15px);font-weight:600;line-height:1.3;text-align:center;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;touch-action:none;-webkit-app-region:no-drag}
.title:hover{filter:brightness(1.08)}
.title.no-seek{cursor:default}
.artist{display:block;width:100%;overflow:hidden;color:#ffffff88;font-size:clamp(11px,2.6vw,12px);text-align:center;text-overflow:ellipsis;white-space:nowrap}
.controls{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:14px;z-index:2}
.ctrl{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#ffffffb8;font-size:15px;transition:transform .12s,color .12s}
.ctrl:hover{transform:scale(1.12);color:#fff}
.ctrl.main{width:42px;height:42px;background:#ffffff20;color:#fff;font-size:17px}
.ctrl.main:hover{background:#ffffff30}
.ctrl.open{width:auto;height:auto;padding:4px 10px;border-radius:8px;font-size:11px;color:#ffffff88}
.ctrl.open:hover{color:#fff;background:#ffffff14}
.resize-grip{position:absolute;right:1px;bottom:1px;z-index:6;width:12px;height:12px;cursor:nwse-resize;opacity:.35}
@keyframes coverbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}
</style>
</head>
<body>
<div class="shell idle" id="shell">
 <canvas id="aurora" aria-hidden="true"></canvas>
 <div class="ui-layer">
  <div class="top">
   <div class="brand">PLAYERKRUT</div>
   <div class="actions">
    <button class="version" id="version" title="Версия">v1.15.0</button>
    <button class="winbtn" id="pin" title="Поверх окон">⌖</button>
    <button class="winbtn" id="min" title="Свернуть">—</button>
    <button class="winbtn" id="close" title="Закрыть">×</button>
   </div>
  </div>
  <div class="stage">
   <div class="cover-scene">
    <div class="orb-wrap" id="orbWrap">
     <div class="orb">
      <div class="cover-ph">♪</div>
      <img id="art" alt="" style="display:none">
     </div>
    </div>
   </div>
   <div class="track-info">
    <div class="title no-seek" id="title" role="slider" tabindex="0">Ищем музыку…</div>
    <div class="artist" id="artist">Запусти музыку</div>
   </div>
   <div class="controls">
    <button class="ctrl" id="previous" title="Предыдущий">⏮</button>
    <button class="ctrl main" id="playpause" title="Play/Pause">▶</button>
    <button class="ctrl" id="next" title="Следующий">⏭</button>
    <button class="ctrl open" id="openapp" title="Открыть приложение">↗</button>
   </div>
  </div>
 </div>
 <div class="resize-grip" id="resizeGrip"></div>
</div>
<script src="player.js"></script>
</body>
</html>
