<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlayerKrut · 1.13.1</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:"Segoe UI",Inter,system-ui,sans-serif;user-select:none}
button{font:inherit;border:0;background:transparent;color:inherit;cursor:pointer}
.shell{position:relative;isolation:isolate;display:flex;flex-direction:column;width:100%;height:100%;overflow:hidden;border-radius:16px;background:#000;box-shadow:0 20px 50px #000c}
#aurora{position:absolute;inset:0;z-index:0;width:100%;height:100%;pointer-events:none}
.ui-layer{position:relative;z-index:1;display:flex;flex:1;flex-direction:column;min-height:0;padding:8px 12px 14px}
.top{display:flex;align-items:center;justify-content:flex-end;gap:3px;min-height:20px;-webkit-app-region:drag}
.top .winbtn{opacity:0;transition:opacity .18s}
.shell:hover .top .winbtn{opacity:.85}
.winbtn{display:grid;place-items:center;width:20px;height:20px;border-radius:5px;background:#ffffff12;color:#ffffffb0;font-size:11px;-webkit-app-region:no-drag}
.winbtn:hover{background:#ffffff28;color:#fff}
.stage{display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:0;min-height:0}
.cover-scene{position:relative;display:grid;place-items:center;width:min(48vw,34vh,168px);aspect-ratio:1;flex:0 0 auto;margin-bottom:clamp(10px,2.5vh,18px);z-index:2}
.orb-wrap{position:relative;width:100%;height:100%}
.orb{position:absolute;inset:0;overflow:hidden;border-radius:14px;background:#1a1216;box-shadow:0 8px 32px #000a}
.orb img{display:block;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.cover-ph{position:absolute;inset:0;display:grid;place-items:center;color:#ffffff30;font-size:clamp(28px,9vh,48px);pointer-events:none}
.orb-wrap.has-cover .cover-ph{display:none}
.orb-wrap.playing .orb{animation:coverbeat 3s ease-in-out infinite}
.track-info{display:flex;flex-direction:column;align-items:center;width:min(86%,280px);gap:0;z-index:2}
.title{display:block;width:100%;padding:8px 18px;overflow:hidden;border-radius:999px;background:linear-gradient(90deg,#e0708899 0%,#e0708899 var(--track-progress,0%),#ffffff1a var(--track-progress,0%),#ffffff1a 100%);border:1px solid #ffffff18;color:#fff;font-size:clamp(12px,3.4vw,15px);font-weight:600;line-height:1.3;text-align:center;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;touch-action:none;-webkit-app-region:no-drag;backdrop-filter:blur(8px)}
.title:hover{filter:brightness(1.1)}
.title.no-seek{cursor:default}
.title.no-seek:hover{filter:none}
.artist{display:none}
.controls{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:clamp(12px,3vh,20px);z-index:2}
.ctrl{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#ffffffb8;font-size:15px;transition:transform .12s,color .12s}
.ctrl:hover{transform:scale(1.12);color:#fff}
.ctrl.main{width:40px;height:40px;background:#ffffff22;color:#fff;font-size:16px;backdrop-filter:blur(6px)}
.ctrl.main:hover{background:#ffffff33}
.resize-grip{position:absolute;right:1px;bottom:1px;z-index:6;width:12px;height:12px;cursor:nwse-resize;touch-action:none;opacity:.35}
@keyframes coverbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}
@media(max-height:280px){
 .cover-scene{width:min(28vh,90px);margin-bottom:6px}
 .controls{gap:14px;margin-top:8px}
 .ctrl.main{width:32px;height:32px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell idle" id="shell">
 <canvas id="aurora" aria-hidden="true"></canvas>
 <div class="ui-layer">
  <div class="top">
   <button class="winbtn" id="pin" title="Поверх окон" aria-label="Поверх окон">⌖</button>
   <button class="winbtn" id="min" title="Свернуть" aria-label="Свернуть">—</button>
   <button class="winbtn" id="close" title="Закрыть" aria-label="Закрыть">×</button>
  </div>
  <div class="stage">
   <div class="cover-scene">
    <div class="orb-wrap" id="orbWrap">
     <div class="orb">
      <div class="cover-ph" aria-hidden="true">♪</div>
      <img id="art" alt="" style="display:none">
     </div>
    </div>
   </div>
   <div class="track-info">
    <div class="title no-seek" id="title" role="slider" tabindex="0" aria-label="Название и перемотка" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">Ищем музыку…</div>
    <div class="artist" id="artist">Запусти музыку</div>
   </div>
   <div class="controls">
    <button class="ctrl" id="previous" title="Предыдущий" aria-label="Предыдущий">⏮</button>
    <button class="ctrl main" id="playpause" title="Пауза / Play" aria-label="Пауза / Play">▶</button>
    <button class="ctrl" id="next" title="Следующий" aria-label="Следующий">⏭</button>
   </div>
  </div>
 </div>
 <div class="resize-grip" id="resizeGrip" title="Изменить размер"></div>
</div>
<script>
PLACEHOLDER_SCRIPT
</script>
</body>
</html>
