<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlayerKrut</title>
<style>
*{box-sizing:border-box}body{margin:0;background:transparent;color:#fff;font-family:Inter,"Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none}
.shell{position:relative;margin:7px;padding:13px 14px 12px;border:1px solid #ffffff1c;border-radius:23px;background:linear-gradient(120deg,#21162eeb,#11111bea 62%,#24172aeb);box-shadow:0 14px 40px #0008;overflow:hidden;backdrop-filter:blur(22px)}
.shell:before{content:"";position:absolute;width:170px;height:170px;right:-52px;top:-90px;border-radius:50%;background:#ec489944;filter:blur(30px);pointer-events:none}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;-webkit-app-region:drag}.brand{font-size:10px;font-weight:800;letter-spacing:2.4px;color:#f6a7db}.winbtns{display:flex;gap:5px;-webkit-app-region:no-drag}.winbtn{width:19px;height:19px;border:0;border-radius:7px;color:#ffffffa0;background:#ffffff0c;cursor:pointer}.winbtn:hover{background:#ffffff22}
.track{display:flex;align-items:center;gap:12px;min-width:0}.cover{width:57px;height:57px;flex:0 0 57px;border-radius:16px;display:grid;place-items:center;position:relative;overflow:hidden;background:linear-gradient(135deg,#ff76bd,#8754ff 55%,#161426);box-shadow:0 5px 22px #bc43a344}.cover:before,.cover:after{content:"";position:absolute;border:1px solid #ffffff42;border-radius:50%;width:45px;height:45px;animation:spin 8s linear infinite}.cover:after{width:29px;height:29px;animation-direction:reverse;animation-duration:5s}.disc{font-size:20px;z-index:1}.info{min-width:0;flex:1}.eyebrow{font-size:9px;letter-spacing:1.4px;color:#e9a4d6;margin-bottom:5px}.title{font-size:14px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{font-size:11px;color:#b9b4c8;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls{display:flex;gap:7px}.ctrl{width:31px;height:31px;border:1px solid #ffffff12;border-radius:50%;background:#ffffff0b;color:white;cursor:pointer;font-size:16px}.ctrl:hover{background:#ffffff20}
.bottom{display:flex;align-items:center;gap:9px;margin-top:10px}.equalizer{height:13px;display:flex;align-items:center;gap:2px;width:38px}.equalizer i{display:block;width:3px;border-radius:3px;background:#f17cc4;height:4px;animation:wave .8s ease-in-out infinite alternate}.equalizer i:nth-child(2){animation-delay:-.3s}.equalizer i:nth-child(3){animation-delay:-.6s}.equalizer i:nth-child(4){animation-delay:-.15s}.equalizer i:nth-child(5){animation-delay:-.45s}.status{font-size:9px;color:#aaa3b8;flex:1}.source{font-size:9px;color:#d8b0d1;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.progress{position:absolute;bottom:0;left:0;height:2px;width:38%;background:linear-gradient(90deg,#f36fbd,#9d72ff);animation:glow 2s infinite alternate}.shell.idle .equalizer i{animation-play-state:paused;height:3px}.shell.idle .cover{filter:saturate(.45)}
@keyframes wave{from{height:3px}to{height:13px}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes glow{from{opacity:.55}to{opacity:1}}
</style></head><body><div class="shell" id="shell">
<div class="top"><div class="brand">PLAYER<span style="color:#fff">KRUT</span></div><div class="winbtns"><button class="winbtn" id="pin" title="Поверх окон">⌖</button><button class="winbtn" id="min" title="Свернуть">−</button><button class="winbtn" id="close" title="Закрыть">×</button></div></div>
<div class="track"><div class="cover"><span class="disc">♫</span></div><div class="info"><div class="eyebrow" id="eyebrow">СЕЙЧАС ИГРАЕТ</div><div class="title" id="title">Ищем музыку…</div><div class="artist" id="artist">Запусти трек в любом приложении</div></div><div class="controls"><button class="ctrl" id="refresh" title="Обновить">↻</button></div></div>
<div class="bottom"><div class="equalizer" id="eq"><i></i><i></i><i></i><i></i><i></i></div><div class="status" id="status">WINDOWS MEDIA SESSION</div><div class="source" id="source">LIVE • DESKTOP</div></div><div class="progress" id="progress"></div></div>
<script>
const $=id=>document.getElementById(id);let busy=false;
async function update(){if(busy)return;busy=true;try{const d=await window.playerAPI.getNowPlaying();const has=!!(d&&d.title);$('shell').classList.toggle('idle',!d?.playing);$('title').textContent=has?d.title:'Ничего не играет';$('artist').textContent=has?(d.artist||'Неизвестный исполнитель'):'Запусти музыку — я покажу трек';$('eyebrow').textContent=d?.playing?'СЕЙЧАС ИГРАЕТ':has?'НА ПАУЗЕ':'ТВОЙ МИНИ-ПЛЕЕР';$('status').textContent=d?.playing?'♫  PLAYING NOW':has?'Ⅱ  PAUSED':'ОЖИДАЕМ МЕДИА';$('source').textContent=has?(d.app||'DESKTOP').split('!')[0].split('.').pop().slice(0,18).toUpperCase():'LIVE • DESKTOP';$('progress').style.width=d?.playing?'68%':'0%';}catch(e){$('title').textContent='Не удалось прочитать трек';$('artist').textContent='Проверь поддержку медиа в Windows';}finally{busy=false}}
$('refresh').onclick=update;$('close').onclick=()=>window.playerAPI.close();$('min').onclick=()=>window.playerAPI.minimize();$('pin').onclick=()=>window.playerAPI.togglePin();update();setInterval(update,2500);
</script></body></html>
